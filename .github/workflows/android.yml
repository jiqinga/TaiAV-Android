name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Check release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', text)[1]
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f'v{version}', f'Tag {tag} does not match versionName {version}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APP_VERSION={version}\n')
          PY
      - name: Check scripts
        run: |
          mkdir -p artifacts
          npm ci --prefix tools --ignore-scripts
          node tools/ad_filter_checks.cjs
          node tools/media_monitor_checks.cjs
      - name: Build and verify debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug :network:checkNetwork
      - uses: actions/upload-artifact@v4
        with:
          name: TaiAV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taiav-release.jks"
          chmod 600 "$RUNNER_TEMP/taiav-release.jks"
          echo "TAIAV_SIGNING_STORE_FILE=$RUNNER_TEMP/taiav-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAIAV_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAIAV_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAIAV_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease lintRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/TaiAV-${APP_VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/TaiAV-${APP_VERSION}.apk" > release/signature.txt
          (cd release && sha256sum "TaiAV-${APP_VERSION}.apk" > SHA256SUMS.txt)
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/taiav-release.jks"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-apk
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_number }}
          path: |
            artifacts/*-dom.json
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "TaiAV $RELEASE_TAG" --generate-notes --latest
          fi
